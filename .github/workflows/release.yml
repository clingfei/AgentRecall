name: Release Multi-Platform VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for Microsoft Entra ID OIDC Workload Identity Federation

jobs:
  build-and-package:
    name: Build VSIX (${{ matrix.vsce_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
            binary_name: agentrecall
            use_cross: false

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            vsce_target: linux-arm64
            binary_name: agentrecall
            use_cross: true

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            binary_name: agentrecall
            use_cross: false

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            binary_name: agentrecall.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for linux-arm64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Rust Binary (Native / Cross)
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare bin directory for extension package
        shell: bash
        run: |
          mkdir -p bin
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} bin/${{ matrix.binary_name }}
          chmod +x bin/${{ matrix.binary_name }} || true

      - name: Package VSIX for ${{ matrix.vsce_target }}
        shell: bash
        run: |
          npx --yes @vscode/vsce package --target ${{ matrix.vsce_target }} -o agentrecall-${{ matrix.vsce_target }}.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentrecall-${{ matrix.vsce_target }}
          path: agentrecall-${{ matrix.vsce_target }}.vsix

      # Mode 1: Modern Microsoft Entra ID Workload Identity Federation (OIDC / Keyless)
      - name: Azure Login (Entra ID OIDC)
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish with Entra ID Workload Identity
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          npx --yes @vscode/vsce publish --target ${{ matrix.vsce_target }} --azure-credential

      # Mode 2: Legacy PAT Fallback (if VSCE_PAT is provided and Entra ID is not configured)
      - name: Publish with Legacy PAT (Fallback)
        if: env.AZURE_CLIENT_ID == '' && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: bash
        run: |
          npx --yes @vscode/vsce publish --target ${{ matrix.vsce_target }} -p ${{ secrets.VSCE_PAT }}

  github-release:
    name: Create GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: vsix-artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: vsix-artifacts/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
