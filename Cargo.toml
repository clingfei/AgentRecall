[package]
name = "agentrecall"
version = "0.1.0"
edition = "2021"
authors = ["Cheng Lingfei <chenglingfei@foxmail.com>"]
description = "Unified search, history recall, and export for AI coding agents in VS Code and terminal"
license = "MIT"
repository = "https://github.com/clingfei/agent-recall"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
